<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客 - 联系方式</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>我的博客</h1>
            <p>分享我的思考与经验</p>
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="about.html">关于我</a></li>
                <li><a href="contact.html" class="active">联系方式</a></li>
            </ul>
        </div>
    </nav>
    
    <main>
        <div class="container">
            <section class="contact-page">
                <h2>联系我</h2>
                
                <div class="contact-content">
                    <div class="contact-info">
                        <h3>联系方式</h3>
                        <ul>
                            <li><i class="fab fa-github"></i> <a href="https://github.com/BloomFallr" target="_blank">github.com/yourusername</a></li> <!-- 修改为你的GitHub账号 -->
                        </ul>
                        
                        <h3>关注我</h3>
                        <p>如果你喜欢我的博客，可以通过以下方式获取最新更新：</p>
                        <ul>
                        </ul>
                    </div>
                    
                    <div class="contact-form">
                        <h3>给我留言</h3>
                        <form id="contactForm">
                            <div class="form-group">
                                <label for="name">姓名</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="email">邮箱</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="subject">主题</label>
                                <input type="text" id="subject" name="subject" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="message">留言内容</label>
                                <textarea id="message" name="message" rows="5" required></textarea>
                            </div>
                            
                            <button type="submit" class="btn">发送留言</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="social-links">
                    <a href="https://github.com/BloomFallr"><i class="fab fa-github"></i></a>
                </div>
                <p>&copy; 2025 我的个人博客. 保留所有权利。</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
