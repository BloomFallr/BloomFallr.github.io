<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客 - 首页</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>我的博客</h1> <!-- 在这里修改你的博客名称 -->
            <p>分享我的思考与经验</p> <!-- 在这里修改你的博客简介 -->
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="about.html">关于我</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>
    
    <main>
        <div class="container">
            <section class="featured-posts">
                <h2>精选文章</h2>
                <div class="post-grid">
                    <!-- 在这里添加你的精选博客文章 -->
                    <article class="post-card">
                        <img src="https://via.placeholder.com/300x200" alt="文章配图">
                        <div class="post-content">
                            <h3><a href="posts/first-post.html">第一篇博客文章</a></h3>
                            <p class="post-date">2025年3月4日</p>
                            <p>摘要</p>
                            <a href="posts/first-post.html" class="read-more">阅读更多</a>
                        </div>
                    </article>
                    
                    <!-- 可以添加更多的文章卡片 -->
                </div>
            </section>
            
            <section class="about-preview">
                <h2>关于我</h2>
                <div class="about-content">
                    <img src="https://via.placeholder.com/200x200" alt="个人照片" class="profile-image">
                    <div>
                        <p>一位中科大本科生, 喜欢游戏, 正在学习 DL 与游戏开发.</p>
                        <a href="about.html" class="btn">了解更多</a>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="social-links">
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                </div>
                <p>&copy; 2025 我的个人博客. 保留所有权利。</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
